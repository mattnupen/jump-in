# Builds the Jump In iPhone app on a Mac in the cloud and sends it to TestFlight.
# Start it from GitHub: Actions tab > "iPhone app to TestFlight" > Run workflow.
# Needs four repository secrets (see README, "iPhone app"):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
name: iPhone app to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the Apple secrets are set
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Build the web app and copy it into the iPhone project
        run: |
          node build.js
          cd mobile
          npm ci
          node prepare-web.js
          npx cap sync ios

      - name: Save the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool looks for the key as AuthKey_<KEY ID>.p8 in API_PRIVATE_KEYS_DIR.
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/asc" >> "$GITHUB_ENV"
          # Build numbers must go up with every upload: use the time in UTC.
          echo "BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Make a signing certificate and profile
        env:
          BUNDLE_ID: com.mattnupen.jumpin
        run: |
          SIGN="$RUNNER_TEMP/signing"; mkdir -p "$SIGN"
          echo "SIGN=$SIGN" >> "$GITHUB_ENV"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -subj "/CN=Jump In CI" \
            -keyout "$SIGN/dist.key" -out "$SIGN/dist.csr"
          node mobile/ci/asc-signing.js setup "$SIGN"
          # Put the certificate and its key in a throwaway keychain.
          /usr/bin/openssl x509 -inform DER -in "$SIGN/dist.cer" -out "$SIGN/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/dist.key" -in "$SIGN/dist.pem" -out "$SIGN/dist.p12" -passout pass:ci
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$SIGN/dist.p12" -k "$KC" -P ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Xcode 16+ reads profiles from the second folder; older versions from the first.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/jumpin.mobileprovision" "$d/$(cat "$SIGN/profile-uuid").mobileprovision"
          done
          echo "PROFILE_NAME=$(cat "$SIGN/profile-name")" >> "$GITHUB_ENV"

      - name: Build and sign the app (archive)
        working-directory: mobile/ios/App
        run: |
          # Sign only the app target by hand, so the Capacitor packages are left alone.
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/" App.xcodeproj/project.pbxproj
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JumpIn.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.mattnupen.jumpin</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JumpIn.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows up in App Store Connect > TestFlight after Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"

      # Apps already uploaded keep working after their certificate is revoked.
      - name: Remove the certificate, profile and key
        if: always()
        run: |
          [ -n "$SIGN" ] && node mobile/ci/asc-signing.js cleanup "$SIGN" || true
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signing"
