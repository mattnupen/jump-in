<title>Jump In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; status bar, scrolling view, fixed tab bar. Deliberately dark-only. */
:root {
  --bg: #0E1214;
  --surface: #1A2226;
  --surface-2: #263036;
  --line: #34424A;
  --fg: #F4F4F0;
  --muted: #B8C2C8;
  --accent: #5EE0C8;
  --accent-ink: #0E1214;
  --accent-soft: #173A35;
  --warn: #F7C948;
  --danger: #FF8A7A;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --font-body: 'DM Sans', -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { width: 36px; height: 36px; flex-shrink: 0; display: block; }
.ic.s { width: 24px; height: 24px; }
.ic.m { width: 30px; height: 30px; }
.ic.l { width: 46px; height: 46px; }
.ic.xl { width: 84px; height: 84px; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.3px; }
.status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); }
.dot.ok { background: var(--accent); }
.dot.warn { background: var(--warn); }

.said { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 18px; padding: 6px 6px 6px 8px; min-height: 64px; }
.said.hold { background: #3A3216; outline: 2px solid var(--warn); }
.said .words { display: flex; gap: 4px; overflow: hidden; flex: 1; min-width: 0; align-items: center; }
.said .empty { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.said .text { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.word { display: flex; flex-direction: column; align-items: center; min-width: 44px; flex-shrink: 0; }
.word span { font-size: 11px; font-weight: 700; white-space: nowrap; }
.roundbtn { width: 48px; height: 48px; border-radius: 24px; border: none; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

main { flex: 1; padding: 4px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.row::-webkit-scrollbar { display: none; }
.chip { height: 48px; padding: 0 14px 0 6px; border-radius: 24px; border: 2px solid transparent; background: var(--surface); display: flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 500; font-size: 15px; flex-shrink: 0; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.avatar { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.avatar .ic { width: 26px; height: 26px; }

.moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.movewrap { position: relative; display: flex; }
.movewrap .move { flex: 1; width: 100%; min-height: 150px; padding-bottom: 46px; justify-content: flex-start; }
.morebtn { position: absolute; right: 8px; bottom: 8px; height: 30px; padding: 0 9px 0 5px; border-radius: 15px; border: 1.5px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
.yesno { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.yesno .tile { min-height: 64px; font-size: 12px; }
.page { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.page-head { position: sticky; top: calc(-12px - env(safe-area-inset-top, 0px)); z-index: 2; background: var(--bg); margin: -12px -16px 0; padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px; }
.page-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 26px; display: flex; align-items: center; gap: 8px; }
.ptiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ptile { position: relative; min-height: 76px; border-radius: 18px; border: none; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 8px; text-align: left; font-weight: 700; font-size: 15px; line-height: 1.2; }
.ptile:active { transform: scale(0.97); }
.ptile .icons { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.ptile .icons .ic { width: 32px; height: 32px; }
.x { position: absolute; z-index: 1; top: -6px; right: -6px; width: 30px; height: 30px; border-radius: 15px; border: none; background: var(--danger); display: flex; align-items: center; justify-content: center; }
.move { position: relative; min-height: 118px; border-radius: 22px; border: 3px solid transparent; background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; text-align: left; transition: transform .08s; }
.move:active, .tile:active, .chip:active, .join:active { transform: scale(0.97); }
.move.next { background: var(--accent-soft); border-color: var(--accent); }
.move .head { display: flex; align-items: center; gap: 8px; width: 100%; }
.move .name { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.badge { position: absolute; top: -11px; right: 12px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; padding: 2px 7px 2px 3px; border-radius: 9px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 2px; }
.ic.xs { width: 16px; height: 16px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.move .phrase { font-size: 13px; color: #D3DCDF; line-height: 1.3; }

.alts { background: var(--surface); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.join { min-height: 58px; border-radius: 18px; border: none; background: var(--surface-2); display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; text-align: left; font-weight: 700; font-size: 16px; width: 100%; }
.join .icons { display: flex; gap: 2px; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.big { min-height: 58px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 0 10px; }
.big.warn { border-color: var(--warn); }
.big.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.big.wide { width: 100%; }

.reactions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { min-height: 78px; border-radius: 18px; border: none; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 13px; padding: 4px; }

.news { display: flex; flex-direction: column; gap: 10px; }
.card { border-radius: 22px; border: 3px solid transparent; background: var(--surface); padding: 8px; display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; }
.card.on { border-color: var(--accent); background: var(--accent-soft); }
.photo { width: 104px; height: 104px; border-radius: 16px; flex-shrink: 0; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
.card .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.wordsrow { display: flex; gap: 4px; flex-wrap: wrap; }
.wordsrow .word { background: var(--surface-2); border-radius: 10px; padding: 3px 4px; }
.card .sentence { font-size: 14px; color: #D3DCDF; }
.edit-row { display: flex; gap: 8px; }
.small { height: 44px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.small.danger { color: var(--danger); border-color: #5A3A36; }
.small.accent { border-color: var(--accent); color: var(--accent); }

.section { background: var(--surface); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.section h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; text-wrap: balance; }
.section p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.input { height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; width: 100%; min-width: 0; }
select.input { padding-right: 8px; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.sub { background: var(--bg); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.flexrow { display: flex; gap: 8px; align-items: center; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.tog { height: 44px; padding: 0 10px 0 4px; border-radius: 22px; border: 2px solid var(--line); background: transparent; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; }
.tog.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.iconbtn { width: 48px; height: 48px; border-radius: 14px; border: 1.5px dashed var(--line); background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.note { font-size: 13px; color: var(--muted); }
.note.err { color: var(--danger); }
.banner { background: #22301F; border: 1.5px solid #4C6A3E; border-radius: 14px; padding: 6px 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; line-height: 1.4; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #12181B; border-top: 1px solid var(--surface-2); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.tab { height: 62px; border: none; border-radius: 16px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab.on { background: var(--accent-soft); color: var(--fg); }
.tab .ic { width: 30px; height: 30px; }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 9, 0.7); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--surface-2); }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; flex: 1; }
.picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.show { position: fixed; inset: 0; z-index: 30; background: var(--accent); color: var(--accent-ink); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.show .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.show .cell.solo { grid-column: 1 / -1; min-height: 200px; }
.show .cell { min-height: 150px; border-radius: 24px; background: var(--accent-ink); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 20px; text-align: center; padding: 8px; }
.show .sentence { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.15; text-wrap: balance; }
.show .tip { margin-top: auto; display: flex; gap: 10px; align-items: center; background: rgba(14,18,20,0.12); border-radius: 18px; padding: 10px 12px; font-size: 16px; line-height: 1.35; }
.show .closer { align-self: flex-start; height: 48px; padding: 0 16px; border-radius: 24px; border: none; background: var(--accent-ink); color: var(--fg); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-tips { display: flex; flex-direction: column; gap: 10px; }
.card-tips div { display: flex; gap: 12px; align-items: center; font-size: 18px; font-weight: 500; }
.card-tips .ic { background: var(--accent-ink); border-radius: 10px; padding: 3px; width: 44px; height: 44px; }
.spinner { width: 18px; height: 18px; border-radius: 9px; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  <div class="top">
    <div class="brand">
      <img class="ic m" id="brandIcon" alt="">
      <b>Jump In</b>
      <span class="status" id="status"><span>Loading</span></span>

  </div>
  <main id="view"></main>
</div>

async function initStore() {
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (user) uid = await user.id();

  } catch (e) {}
  if (db && uid) {
    try {
      store.col = db.collection('data/users/' + uid);
      const snap = await store.col.get();
      let profile = null; const news = [];
      snap.docs.forEach(d => {
        const data = d.data(); if (!data) return;
        if (data.kind === 'profile') profile = data.profile;
        if (data.kind === 'news' && data.item) news.push(data.item);

      if (profile) { S.profile = profile; S.news = news; afterLoad(); }

  if (store.mode !== 'db') {

function blobToBase64(blob) {

}
const serverSample = {
  async json(prompt, opts) {
    const o = opts || {};
    const imgs = o.images ? [].concat(o.images) : [];
    const images = [];
    for (const b of imgs) images.push({ media_type: b.type || 'image/jpeg', data: await blobToBase64(b) });
    const r = await fetch('/api/suggest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, images, tier: o.modelTier || 'default' }) });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(out.error || 'failed'); e.code = out.code || 'unavailable'; throw e; }

function openPicker(cb) { S.pickerCb = cb; S.layer = 'picker'; renderLayer(); }

function fileToDataURL(file, max) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.72);
        c.toBlob(blob => resolve({ url, blob }), 'image/jpeg', 0.8);
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}
async function onPhoto(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  try {
    const out = await fileToDataURL(file, 640);
    S.editor.photo = out.url;
    S.editor.file = out.blob || file; S.editor.msg = ''; S.editor.msgErr = false;
  } catch (e) { S.editor.msg = 'That photo could not be opened. Try another one.'; S.editor.msgErr = true; }
  renderLayer();
}

  testVoice() { speak(`Hi, I'm ${S.profile.name || 'here'}. This is my voice.`); },
  friendAdd() { S.profile.friends.push({ id: newId(), name: '', color: FRIEND_COLORS[S.profile.friends.length % FRIEND_COLORS.length], interests: [] }); scheduleSave(); render(); },
  friendDelete(t) { S.profile.friends = S.profile.friends.filter(f => f.id !== t.dataset.id); if (S.withId === t.dataset.id) S.withId = null; scheduleSave(); render(); },
  friendColor(t) { const f = S.profile.friends.find(x => x.id === t.dataset.id); if (!f) return; f.color = FRIEND_COLORS[(FRIEND_COLORS.indexOf(f.color) + 1) % FRIEND_COLORS.length]; scheduleSave(); render(); },
  interest(t) { const f = S.profile.friends.find(x => x.id === t.dataset.id); if (!f) return; const k = t.dataset.k; f.interests = f.interests.includes(k) ? f.interests.filter(x => x !== k) : f.interests.concat(k).slice(-3); scheduleSave(); render(); },
  topicAdd() { const id = newId(); S.profile.topics.push({ id, name: '', icon: 'ticket', phrases: [] }); scheduleSave(); render(); },
  topicDelete(t) { S.profile.topics = S.profile.topics.filter(x => x.id !== t.dataset.id); afterLoad(); scheduleSave(); render(); },
  topicIcon(t) { openPicker(k => { const tp = S.profile.topics.find(x => x.id === t.dataset.id); if (tp) { tp.icon = k; scheduleSave(); } render(); }); },
  phraseAdd(t) { const tp = S.profile.topics.find(x => x.id === t.dataset.id); if (!tp) return; tp.phrases.push({ text: '', words: [] }); scheduleSave(); render(); },
  phraseDelete(t) { const tp = S.profile.topics.find(x => x.id === t.dataset.id); if (!tp) return; tp.phrases.splice(Number(t.dataset.i), 1); scheduleSave(); render(); },
  phraseIcon(t) {
    openPicker(k => {
      const tp = S.profile.topics.find(x => x.id === t.dataset.id); const ph = tp && tp.phrases[Number(t.dataset.i)];
      if (ph) { ph.words = [{ icon: k, label: LABELS[k] }].concat(ph.words.slice(1, 2)); scheduleSave(); }
      render();
    });
  },
  async topicSuggest(t) {
    const tp = S.profile.topics.find(x => x.id === t.dataset.id); if (!tp || !sampleFn) return;
    if (!tp.name.trim()) { S.topicMsg[tp.id] = 'Type the topic name first.'; render(); return; }
    S.topicBusy = tp.id; S.topicMsg[tp.id] = ''; render();
    try {
      const res = await sampleFn.json(
        `A teenager who talks with a picture-based communication app (AAC) is at lunch with friends who are talking about "${tp.name.trim().slice(0, 80)}". ` +
        'Write 4 short things the teen could say to join in: casual, age-appropriate, at most 7 words each, no emoji. Mix a comment, a question and an invitation. ' +
        'For each, pick 1 or 2 pictograph keys from this list (use the keys exactly): ' + iconListForPrompt() + '. ' +
        'Reply with only a JSON array: [{"text": string, "icons": [string]}]',
        { modelTier: 'quick' }
      );
      const list = (Array.isArray(res) ? res : []).slice(0, 4).map(r => ({
        text: String((r && r.text) || '').slice(0, 80),
        words: ((r && Array.isArray(r.icons)) ? r.icons : []).filter(k => ICON[k]).slice(0, 2).map(k => ({ icon: k, label: LABELS[k] || k }))
      })).filter(r => r.text);
      list.forEach(r => { if (!r.words.length) r.words = [{ icon: tp.icon, label: LABELS[tp.icon] || 'topic' }]; });
      tp.phrases = tp.phrases.filter(ph => ph.text.trim()).concat(list);
      if (!list.length) S.topicMsg[tp.id] = 'No suggestions came back. Try again or add your own.';
      scheduleSave();
    } catch (err) { S.topicMsg[tp.id] = sampleErrorText(err); }
    S.topicBusy = null; render();
  },
  talkCard() { S.layer = 'card'; renderLayer(); },
  reset() { if (!S.confirmReset) { S.confirmReset = true; render(); return; } S.confirmReset = false; resetAll(); }
};
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'closeLayerBg') { if (ev.target === t) actions.closeLayer(); return; }
  const fn = actions[t.dataset.act];
  if (fn) { ev.preventDefault(); fn(t); }
});
document.addEventListener('input', ev => {
  const t = ev.target, b = t.dataset && t.dataset.bind;
  if (!b) return;
  const p = S.profile;
  if (b === 'name') { p.name = t.value; scheduleSave(); }
  else if (b === 'rate') { p.rate = Number(t.value); scheduleSave(); }
  else if (b === 'friend.name') { const f = p.friends.find(x => x.id === t.dataset.id); if (f) { f.name = t.value; scheduleSave(); } }
  else if (b === 'topic.name') { const tp = p.topics.find(x => x.id === t.dataset.id); if (tp) { tp.name = t.value; scheduleSave(); } }
  else if (b === 'phrase.text') { const tp = p.topics.find(x => x.id === t.dataset.id); const ph = tp && tp.phrases[Number(t.dataset.i)]; if (ph) { ph.text = t.value; scheduleSave(); } }
  else if (b === 'editor.note') { S.editor.note = t.value; }
  else if (b === 'draft.text') { S.draft.text = t.value; }
  else if (b === 'editor.sentence') {
    S.editor.sentence = t.value;
    const btn = document.querySelector('[data-act="editorSave"]'); if (btn) btn.disabled = !t.value.trim();
  }
  else if (b === 'editor.word') { const w = S.editor.words[Number(t.dataset.i)]; if (w) w.label = t.value; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.bind === 'voice') { S.profile.voiceURI = t.value; scheduleSave(); }
});

document.getElementById('brandIcon').src = ICON.wave;
render();
renderStatus();
initStore();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
